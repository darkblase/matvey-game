<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Сколько съел Матвей литров вареников</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a0a;--fg:#fff;--card:rgba(255,255,255,.12);--ac:#ffb703}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
button{font:inherit;font-weight:700;color:inherit;border:0;border-radius:14px;padding:10px 12px;background:var(--card);min-height:48px;cursor:pointer}
button:active{transform:scale(.96)}button:disabled{opacity:.35;filter:grayscale(1);cursor:default;transform:none}
input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--fg);background:transparent;color:var(--fg);min-height:48px;user-select:text;-webkit-user-select:text}
.ac{background:var(--ac)!important;color:#1a1a1a!important}
.scr{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}.top h2{flex:1;margin:0;font-size:20px}.bk{width:48px;padding:0;font-size:22px}
.pill{background:var(--card);border-radius:20px;padding:6px 12px;font-weight:700;white-space:nowrap}
.hm{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}.st{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ph{width:min(34vw,150px);aspect-ratio:1;object-fit:cover;border:4px solid var(--fg);border-radius:16px;display:block}
.gear{justify-self:end;width:52px;padding:0;font-size:24px;border:3px solid var(--fg);background:transparent}
h1{text-align:center;font-size:clamp(20px,6vw,28px);margin:12px 0}
.big{font-size:clamp(50px,18vw,100px);flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px}.nav button{min-height:62px;font-size:14px;padding:6px 2px;border:3px solid var(--fg);background:transparent}.nav .pl{background:var(--ac);color:#111;border-color:var(--ac);font-size:20px}
.q{background:var(--card);border-radius:16px;padding:14px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid button{padding:0;font-size:18px;min-height:56px}
.msg{text-align:center;font-weight:700;min-height:24px}.c{text-align:center;opacity:.8}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px}
.pi{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#000;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{flex:1 1 0;min-width:0;padding:6px 4px;min-height:44px;font-size:13px}.tabs .on{background:var(--ac);color:#111}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sl{position:relative;aspect-ratio:1;padding:0;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.sl img{width:86%;height:86%;object-fit:cover;border-radius:12px;background:#000;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.fl{position:absolute;top:2px;left:50%;font-weight:800;color:#ffd23f;text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap;animation:up 1.2s ease-out forwards}
@keyframes up{from{transform:translate(-50%,0)}to{transform:translate(-50%,-55px);opacity:0}}@keyframes bob{50%{transform:translateY(-5px)}}
.sw{width:64px;height:64px;border-radius:12px;flex:none;border:2px solid var(--fg)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mb{background:#222;color:#fff;border-radius:18px;padding:16px;max-width:420px;width:100%;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mb button{background:rgba(255,255,255,.15)}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#ts.on{opacity:1}
#tu{position:fixed;inset:0;z-index:30}
#hl{position:fixed;border:3px solid var(--ac);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.72)}
#ar{position:fixed;font-size:44px;line-height:1;animation:bob .8s infinite}
#tb{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,420px);background:#222;color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
#tb button{background:rgba(255,255,255,.15)}
</style></head><body>

if(n===G.secret){const e=R(5,40),c=R(30,100);S.elo+=e;S.coins+=c;G.over=1;G.msg=t('win',G.secret)+`<br>+${e} ELO · +${c} 🪙`;save()}
else{G.left--;if(G.left<=0){G.over=1;G.msg=t('lose',G.secret)}else G.msg=t('miss',G.left)}render()}
function tick(dt){S.placed.forEach((id,i)=>{if(!id||i>=S.slots){acc[i]=0;return}const r=rate(id);acc[i]+=dt;if(acc[i]>=r.int){acc[i]-=r.int;S.coins+=r.amt;sess+=r.amt;dirty=1;if(cur==='nur')pop(i,r.amt)}});
document.querySelectorAll('.cn').forEach(e=>e.textContent=S.coins);const s=document.getElementById('sess');if(s)s.textContent=sess}
function pop(i,n){const el=document.getElementById('s'+i);if(!el)return;const f=document.createElement('span');f.className='fl';f.textContent='+'+n+'🪙';f.style.marginLeft=R(-12,12)+'px';el.appendChild(f);setTimeout(()=>f.remove(),1300)}
setInterval(()=>{const n=performance.now(),dt=Math.min((n-last)/1000,2);last=n;if(!document.hidden)tick(dt)},100);
setInterval(()=>{if(dirty)save()},5000);
function tShow(){const T=$('#tu');if(tI<0){T.hidden=true;T.innerHTML='';return}const el=document.getElementById(['b-play','b-shop','b-nur','b-set'][tI]);if(!el){tI=-1;T.hidden=true;return}
const r=el.getBoundingClientRect(),dn=r.top>innerHeight/2;T.hidden=false;
T.innerHTML=`<div id="hl" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div><div id="ar" style="left:${r.left+r.width/2-22}px;top:${dn?r.top-62:r.bottom+8}px">${dn?'👇':'👆'}</div><div id="tb" style="${dn?'top:12%':'bottom:12%'}"><p style="margin:0">${L[S.lang].tr[tI]}</p><div style="display:flex;gap:8px"><button data-a="tx">${t('sk')}</button><button class="ac" data-a="tn" style="flex:1">${tI===3?t('dn'):t('nx')}</button></div></div>`}
function tEnd(ok){tI=-1;tShow();if(ok&&!S.tut){S.tut=true;S.coins+=200;save();render();toast(t('trd'))}}
let AC,mg,mt=null;const TR={1:{bpm:76,ch:[[262,330,392],[220,262,330],[175,220,262],[196,247,294]]},2:{bpm:58,ch:[[220,277,330],[165,208,247],[185,220,277],[147,185,220]]}};
function note(f,t0,d,v,ty){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(v,t0+Math.min(.05,d/3));g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d+.05)}
function mus(){clearInterval(mt);mt=null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.connect(AC.destination)}catch(e){return}}
mg.gain.value=S.vol*.6;if(!S.track||document.hidden){try{AC.suspend()}catch(e){}return}try{AC.resume()}catch(e){}
const T=TR[S.track],sp=60/T.bpm/2;let nt=AC.currentTime+.1,k=0;
mt=setInterval(()=>{while(nt<AC.currentTime+.8){const c=T.ch[Math.floor(k/8)%4];if(k%8===0)note(c[0]/2,nt,sp*8,.5,'sine');note(c[[0,1,2,1,2,1,0,1][k%8]]*(k%16>=8?2:1),nt,sp*2.2,.28,'triangle');nt+=sp;k++}},250)}
function act(a,v){switch(a){
case'go':go(v);break;case'st':start(+v);break;case'g':guess(+v);break;case'again':if(G)start(G.mode);break;case'tab':shopTab=v;revertBg();render();break;case'cm':hideM();break;
case'bp':{const p=P[v];if(!p||S.pets.includes(v))break;if(S.coins<p.pr){toast(t('nm'));break}S.coins-=p.pr;S.pets.push(v);S.up[v]={s:0,c:0};const i=S.placed.findIndex((x,j)=>j<S.slots&&!x);if(i>=0)S.placed[i]=v;save();render();break}
case'sel':selPet=v;render();break;
case'up':{const[id,k]=v.split(':');if(!S.pets.includes(id)||(k!=='s'&&k!=='c'))break;const u=S.up[id]||(S.up[id]={s:0,c:0});if(u[k]>=5)break;const c=(k==='s'?200:300)*(u[k]+1);if(S.coins<c){toast(t('nm'));break}S.coins-=c;u[k]++;save();render();break}
case'pv':clearTimeout(pvT);applyBg(v);toast(t('pvt'));pvT=setTimeout(()=>applyBg(S.bg),3000);break;
case'bb':{const b=BG[v];if(!b||S.bgs.includes(v))break;if(S.coins<b.pr){toast(t('nm'));break}S.coins-=b.pr;S.bgs.push(v);S.bg=v;save();revertBg();render();break}
case'eq':if(S.bgs.includes(v)){S.bg=v;save();revertBg();render()}break;
case'slot':{const i=+v;if(!(i>=0&&i<S.slots))break;const fr=S.pets.filter(id=>!S.placed.includes(id));showM(`<b>${t('put')}</b>`+(fr.length?fr.map(id=>`<button data-a="put" data-v="${i}:${id}">${P[id].n[S.lang]}</button>`).join(''):`<p class="c">${t('none')}</p>`)+(S.placed[i]?`<button data-a="put" data-v="${i}:">${t('rm')}</button>`:''));break}
case'put':{const[i,id]=v.split(':'),n=+i;if(!(n>=0&&n<S.slots))break;if(id){if(!S.pets.includes(id)||S.placed.includes(id))break;S.placed[n]=id}else S.placed[n]=null;acc[n]=0;save();hideM();render();break}
case'bs':{if(S.slots>=8||+v!==S.slots)break;const c=SP[S.slots-4];if(S.coins<c){toast(t('nm'));break}S.coins-=c;S.slots++;save();render();break}
case'lg':S.lang=v==='en'?'en':'ru';document.documentElement.lang=S.lang;document.title=t('title');save();render();break;
case'tk':S.track=+v;save();mus();render();break;
case'tut':go('home');tI=0;tShow();break;case'tn':if(tI>=3)tEnd(true);else{tI++;tShow()}break;case'tx':tEnd(false);break;
case'pr':{const code=($('#pc').value||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');if(!PR[code]){toast(t('pbad'));break}if(S.promos.includes(code)){toast(t('pdup'));break}S.promos.push(code);S.coins+=PR[code];save();render();toast(t('pok',PR[code]));break}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;try{act(b.dataset.a,b.dataset.v)}catch(err){console.error(err);toast('⚠️ '+err.message)}if(!mt&&S.track)mus();else if(AC&&AC.state==='suspended'&&S.track)AC.resume()});
document.addEventListener('input',e=>{if(e.target.id==='vol'){S.vol=e.target.value/100;if(mg)mg.gain.value=S.vol*.6;dirty=1}});
document.addEventListener('change',e=>{if(e.target.id==='vol')save()});
document.addEventListener('focusin',e=>{if(e.target.id==='pc')setTimeout(()=>e.target.scrollIntoView({block:'center'}),300)});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();clearInterval(mt);mt=null;try{AC&&AC.suspend()}catch(e){}}else{last=performance.now();if(AC&&S.track)mus()}});
addEventListener('pagehide',save);addEventListener('resize',()=>{if(tI>=0)tShow()});addEventListener('error',e=>toast('⚠️ '+e.message));
try{const r=localStorage.getItem(KEY);if(r)load(r)}catch(e){console.warn('load failed',e)}
try{if(tg){tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();tg.BackButton.onClick(()=>{if(!$('#md').hidden)hideM();else if(tI>=0)tEnd(false);else go('home')});
if(tg.CloudStorage&&tg.isVersionAtLeast('6.9'))tg.CloudStorage.getItem(KEY,(er,v)=>{try{if(!er&&v&&JSON.parse(v).ts>S.ts){load(v);applyBg(S.bg);if(cur==='home')render()}}catch(e){}})}}catch(e){console.warn(e)}
document.documentElement.lang=S.lang;document.title=t('title');applyBg(S.bg);go('home');
</script></body></html>
